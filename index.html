<!DOCTYPE html><html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>수어 학습 사이트</title>
    <style>
    :root{
      --bg:#0b0d12;
      --panel:#121722;
      --panel-2:#1a2230;
      --line:#2b3445;
      --text:#edf2ff;
      --sub:#a9b6cc;
      --accent:#6ea8ff;
      --accent-2:#8ef0c2;
      --warning:#ffc76e;
      --danger:#ff7b7b;
      --shadow:0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
      --header-h:176px;
      --footer-h:116px;
    }*{box-sizing:border-box;}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  overflow:hidden;
}

body{
  height:100vh;
  height:100dvh;
}

button,select,input{
  font:inherit;
}

.app{
  display:grid;
  grid-template-rows:auto minmax(0, 1fr) auto;
  height:100%;
  width:100%;
  min-height:0;
}

.header{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding:10px 14px;
  border-bottom:1px solid var(--line);
  background:rgba(10,13,18,.94);
  backdrop-filter:blur(10px);
  position:relative;
  z-index:50;
}

.header-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  flex-wrap:wrap;
}

.search-wrap{
  position:relative;
  flex:1;
  min-width:220px;
}

.search{
  width:100%;
  height:42px;
  touch-action:manipulation;
  -webkit-user-select:text;
  user-select:text;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 14px;
  background:#fff;
  color:#111;
  font-size:15px;
}

.search-suggestions{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:#fff;
  color:#111;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.32);
  overflow:auto;
  display:none;
  max-height:min(31vh, 260px);
  z-index:9999;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

.search-suggestions.open{
  display:block;
}

.sync-room-list-container{
  position:absolute;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  z-index:10000;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
  padding:4px 0;
  min-width:120px;
  max-height:240px;
  overflow-y:auto;
  display:none;
}
.sync-room-list-item{
  padding:6px 12px;
  cursor:pointer;
  font-size:14px;
  color:var(--text);
  white-space:nowrap;
}
.sync-room-list-item:hover{
  background:rgba(255,255,255,.08);
}

.suggestion-item{
  padding:10px 12px;
  border-bottom:1px solid #eceff4;
  cursor:pointer;
  line-height:1.45;
  font-size:14px;
  touch-action:pan-y manipulation;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.suggestion-item:last-child{
  border-bottom:none;
}

.suggestion-item:hover,
.suggestion-item.active{
  background:#eef5ff;
}

.suggestion-sub{
  display:block;
  font-size:12px;
  color:#56657d;
  margin-top:4px;
}

.scope-select,
.category-select{
  height:42px;
  min-width:132px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  color:#111;
  cursor:pointer;
  font-size:14px;
}

.count-badge{
  white-space:nowrap;
  color:var(--sub);
  font-size:13px;
  padding:0 6px;
  min-width:72px;
  display:inline-flex;
  justify-content:center;
  align-items:center;
  border-radius:12px;
  border:1px solid transparent;
  height:42px;
}

.quick-btn{
  display:none;
}

.header-row-search{
  flex-wrap:nowrap;
}

.header-row-search .search-wrap{
  min-width:0;
}

.header-row-actions,
.header-row-sync{
  min-width:0;
}

.header-row-actions .sync-room-input{
  min-width:140px;
  flex:1 1 160px;
}

.header-row-actions .firebase-status{
  min-width:88px;
  height:38px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.03);
  font-size:12px;
}

.stage-tap-zone{
  position:absolute;
  top:0;
  bottom:0;
  width:18%;
  z-index:8;
  display:none;
  background:transparent;
  border:none;
  outline:none;
  padding:0;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
  box-shadow:none;
  -webkit-tap-highlight-color:transparent;
}

.stage-tap-zone.left{ left:0; }
.stage-tap-zone.right{ right:0; }

.stage-tap-zone::after{
  content:"";
  display:none;
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border-radius:999px;
  background:rgba(5,10,18,.18);
  opacity:0;
  transition:.15s ease;
}

.stage-tap-zone.left::after{ left:6px; }
.stage-tap-zone.right::after{ right:6px; }

.stage-tap-zone:active::after{
  opacity:1;
}

.stage-tap-zone .tap-arrow{
  position:absolute;
  display:none !important;
  top:50%;
  transform:translateY(-50%);
  color:rgba(255,255,255,.75);
  font-size:22px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  display:none;
}

.stage-tap-zone.left .tap-arrow{ left:14px; }
.stage-tap-zone.right .tap-arrow{ right:14px; }


video::-webkit-media-controls-overlay-play-button,
video::-webkit-media-controls-start-playback-button{
  display:none !important;
  -webkit-appearance:none;
  opacity:0 !important;
}

.rotate-hotspot{
  position:absolute;
  left:0;
  top:0;
  width:min(10vmin, 56px);
  height:min(10vmin, 56px);
  z-index:40;
  border:none;
  background:transparent;
  color:transparent;
  opacity:.03;
  display:none;
  pointer-events:auto;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

.rotate-hotspot:active{
  opacity:.08;
}

.top-home-btn{
  display:none;
}

.firebase-status{
  min-width:0;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
}

.sync-room-input{ height:42px; min-width:150px; border:none; outline:none; border-radius:12px; padding:0 12px; background:#fff; color:#111; font-size:14px; flex:1 1 180px; }

.firebase-status{ min-height:42px; padding:0 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2); color:var(--sub); font-size:13px; display:inline-flex; align-items:center; white-space:nowrap; }

.firebase-status.ok{ color:#dffbe8; border-color:#2f855a; background:rgba(47,133,90,.18); }

.firebase-status.error{ color:#ffdada; border-color:#b84b4b; background:rgba(184,75,75,.16); }

.icon-btn,.mode-btn,.nav-btn,.playback-btn,.select-btn,.link-btn{
  border:none;
  outline:none;
  cursor:pointer;
  color:var(--text);
  background:var(--panel-2);
  border:1px solid var(--line);
  transition:.15s ease;
  border-radius:12px;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.icon-btn:hover,.mode-btn:hover,.nav-btn:hover,.playback-btn:hover,.select-btn:hover,.link-btn:hover{
  transform:translateY(-1px);
  border-color:#45618d;
}

.icon-btn,.playback-btn,.select-btn,.link-btn{
  height:42px;
  min-width:42px;
  padding:0 12px;
  white-space:nowrap;
  font-size:14px;
}

.select-btn.active,
.playback-btn.active{
  background:linear-gradient(180deg,#5f4d16,#47390f);
  border-color:var(--warning);
  color:#fff3d4;
}

.main{
  display:grid;
  grid-template-columns:1.35fr .9fr;
  gap:14px;
  padding:14px;
  min-height:0;
  overflow:hidden;
}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-height:0;
  overflow:hidden;
}

.viewer{
  display:flex;
  flex-direction:column;
  min-height:0;
  position:relative;
}

.stage{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#000;
  position:relative;
  overflow:hidden;
  touch-action:pan-y pinch-zoom;
}

video,
.main-frame,
.main-image,
.main-text{
  width:100%;
  height:100%;
  display:none;
  background:#000;
}

video,
.main-image{
  object-fit:contain;
}

.main-frame{
  border:0;
}

.main-image{
  user-select:none;
  -webkit-user-drag:none;
  transform-origin:center center;
  will-change:transform;
}

.main-gallery{
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:4px;
  background:#000;
}

.main-gallery.is-single{
  padding:0;
  gap:0;
}

.main-gallery-item{
  flex:1 1 0;
  min-width:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  overflow:hidden;
  background:#05070b;
}

.main-gallery.is-single .main-gallery-item{
  border:none;
  border-radius:0;
  background:#000;
}

.main-gallery-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.main-image.zoomable{
  touch-action:none;
}

.main-image.zoomed{
  cursor:grab;
}

.main-text{
  display:none;
  align-items:center;
  justify-content:center;
  padding:clamp(18px,4vw,64px);
  text-align:center;
  font-weight:800;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:keep-all;
  color:#f7f9ff;
  background:
    radial-gradient(circle at 18% 20%, rgba(110,168,255,.18), transparent 28%),
    radial-gradient(circle at 82% 28%, rgba(142,240,194,.12), transparent 28%),
    linear-gradient(180deg, #0b0f17 0%, #101725 100%);
  font-size:clamp(28px,4.2vw,68px);
}

.caption-mask{
  position:absolute;
  display:none;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  width:min(78%, 920px);
  height:14%;
  min-height:44px;
  max-height:28%;
  border-radius:18px;
  background:rgba(8,10,14,.96);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 10px 24px rgba(0,0,0,.38);
  z-index:42;
  pointer-events:auto;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  overflow:visible;
}

.caption-mask.is-visible{
  display:block;
}

.caption-mask.is-dragging,
.caption-mask.is-resizing{
  cursor:grabbing;
}

.caption-mask-resize-handle{
  position:absolute;
  z-index:2;
  background:transparent;
  touch-action:none;
}

.caption-mask-resize-handle::after{
  display:none;
  content:"";
  position:absolute;
  inset:0;
  margin:auto;
  width:12px;
  height:12px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.18);
  box-shadow:0 0 0 1px rgba(0,0,0,.18);
  opacity:.92;
}

.caption-mask-resize-handle[data-dir="n"],
.caption-mask-resize-handle[data-dir="s"]{
  left:14px;
  right:14px;
  height:14px;
}

.caption-mask-resize-handle[data-dir="n"]{
  top:-7px;
  cursor:ns-resize;
}

.caption-mask-resize-handle[data-dir="s"]{
  bottom:-7px;
  cursor:ns-resize;
}

.caption-mask-resize-handle[data-dir="e"],
.caption-mask-resize-handle[data-dir="w"]{
  top:14px;
  bottom:14px;
  width:14px;
}

.caption-mask-resize-handle[data-dir="e"]{
  right:-7px;
  cursor:ew-resize;
}

.caption-mask-resize-handle[data-dir="w"]{
  left:-7px;
  cursor:ew-resize;
}

.caption-mask-resize-handle[data-dir="ne"],
.caption-mask-resize-handle[data-dir="nw"],
.caption-mask-resize-handle[data-dir="se"],
.caption-mask-resize-handle[data-dir="sw"]{
  width:18px;
  height:18px;
}

.caption-mask-resize-handle[data-dir="ne"]{
  top:-9px;
  right:-9px;
  cursor:nesw-resize;
}

.caption-mask-resize-handle[data-dir="nw"]{
  top:-9px;
  left:-9px;
  cursor:nwse-resize;
}

.caption-mask-resize-handle[data-dir="se"]{
  right:-9px;
  bottom:-9px;
  cursor:nwse-resize;
}

.caption-mask-resize-handle[data-dir="sw"]{
  left:-9px;
  bottom:-9px;
  cursor:nesw-resize;
}

.caption-mask-panel{
  position:absolute;
  display:none;
  min-width:220px;
  max-width:min(84vw, 280px);
  padding:10px 12px;
  border-radius:14px;
  background:rgba(10,14,22,.94);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 30px rgba(0,0,0,.42);
  z-index:58;
  color:#eef4ff;
  backdrop-filter:blur(10px);
}

.caption-mask-panel.is-open{
  display:block;
}

.caption-mask-panel-title{
  font-size:13px;
  font-weight:800;
  margin-bottom:8px;
  color:#d9e7ff;
}

.caption-mask-panel-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.caption-mask-panel-row + .caption-mask-panel-row{
  margin-top:8px;
}

.caption-mask-panel input[type="range"]{
  flex:1;
  width:100%;
}

.caption-mask-panel-value{
  min-width:44px;
  text-align:right;
  font-size:12px;
  color:#bfd1ee;
  font-variant-numeric:tabular-nums;
}

.caption-mask-panel-hint{
  margin-top:8px;
  font-size:12px;
  color:#9fb0c8;
  line-height:1.45;
}

.overlay-msg{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(0,0,0,.74);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  padding:12px 16px;
  border-radius:12px;
  font-size:16px;
  z-index:60;
  display:none;
  text-align:center;
  max-width:min(84vw, 900px);
  line-height:1.7;
  white-space:pre-wrap;
  word-break:keep-all;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.drop-hint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  color:#e8f0ff;
  font-size:18px;
  font-weight:700;
  z-index:55;
  pointer-events:none;
  opacity:0;
  transition:opacity .15s ease;
  text-align:center;
  padding:24px;
  line-height:1.6;
}

.drop-hint.show{
  opacity:1;
}

.viewer-bottom{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
  border-top:1px solid var(--line);
  background:var(--panel);
}

.img-box{
  min-height:126px;
  background:#0d1118;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.img-box img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  display:block;
}

.img-label{
  position:absolute;
  left:10px;
  top:10px;
  font-size:12px;
  color:#d7e2f7;
  background:rgba(0,0,0,.45);
  border:1px solid rgba(255,255,255,.12);
  padding:4px 8px;
  border-radius:999px;
}

.info{
  display:flex;
  flex-direction:column;
  min-height:0;
}

.info-scroll{
  flex:1;
  overflow:auto;
  padding:14px 14px 10px;
  -webkit-overflow-scrolling:touch;
}

.info-scroll::-webkit-scrollbar{width:10px;}
.info-scroll::-webkit-scrollbar-thumb{
  background:#2a3445;
  border-radius:999px;
  border:2px solid transparent;
  background-clip:padding-box;
}

.title-row{
  display:flex;
  align-items:flex-start;
  gap:10px;
  justify-content:space-between;
  margin-bottom:8px;
}

.word{
  font-size:30px;
  font-weight:800;
  line-height:1.15;
  margin:0;
  word-break:keep-all;
}

.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
}

.pill{
  display:inline-flex;
  align-items:center;
  min-height:30px;
  padding:0 10px;
  border-radius:999px;
  background:var(--panel-2);
  border:1px solid var(--line);
  color:var(--sub);
  font-size:13px;
}

.section{
  margin-top:10px;
  padding:12px;
  border-radius:16px;
  background:var(--panel);
  border:1px solid var(--line);
}

.section:first-of-type{
  margin-top:0;
}

.section h3{
  margin:0 0 8px;
  font-size:15px;
  color:#cfe0ff;
}

.section .content{
  font-size:15px;
  line-height:1.55;
  color:#f4f7ff;
  word-break:keep-all;
  white-space:pre-wrap;
}

.status-list{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.selection-toggle-btn{
  margin-left:auto;
}

.selection-panel.is-collapsed .selection-body{
  display:none;
}

.selection-panel{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.selection-top{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.selection-search-wrap{
  position:relative;
  flex:1;
  min-width:220px;
}

.selection-search{
  width:100%;
  height:40px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  color:#111;
  font-size:14px;
}

.selection-suggestions{
  position:absolute;
  top:calc(100% + 6px);
  left:0;
  right:0;
  background:#fff;
  color:#111;
  border-radius:14px;
  box-shadow:0 18px 40px rgba(0,0,0,.32);
  overflow:auto;
  display:none;
  max-height:320px;
  z-index:9999;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
}

.selection-suggestions.open{
  display:block;
}

.preset-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.preset-input,
.preset-select{
  height:38px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 10px;
  background:#fff;
  color:#111;
  font-size:14px;
}

.preset-input{
  min-width:140px;
  flex:1;
}

.preset-select{
  min-width:140px;
  flex:1;
}

.selected-chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  min-height:22px;
  max-height:180px;
  overflow:auto;
  padding-right:2px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:#20324a;
  border:1px solid #3b5d88;
  color:#edf4ff;
  padding:6px 10px;
  border-radius:999px;
  font-size:13px;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.chip:active{
  transform:scale(.98);
  background:#294061;
}

.chip button{
  border:none;
  background:none;
  color:#cfe0ff;
  cursor:pointer;
  font-size:14px;
  padding:0;
  line-height:1;
  pointer-events:none;
}

.footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 14px;
  border-top:1px solid var(--line);
  background:rgba(10,13,18,.94);
  backdrop-filter:blur(10px);
}

.nav-group,.mode-group,.extra-group{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
  flex-wrap:wrap;
}

.nav-btn{
  min-width:56px;
  height:46px;
  border-radius:14px;
  font-size:18px;
  padding:0 14px;
}

.mode-btn{
  min-width:42px;
  height:46px;
  border-radius:14px;
